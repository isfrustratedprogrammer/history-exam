<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Билеты по истории России</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<style>
/* Картотека: слева ящик с темами, справа раскрытая карточка темы; на телефоне ящик — отдельный экран, вкладки снизу. */
:root {
  --paper: #f2f5f8;
  --card: #ffffff;
  --band: #e9eef4;
  --ink: #18212c;
  --muted: #5a6778;
  --rule: #d8e0ea;
  --accent: #183153;
  --on-accent: #ffffff;
  --accent-soft: #e2e9f4;
  --again: #a3322b;
  --hard: #8a5a0f;
  --easy: #2e6a40;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --head-h: 60px;
  --tab-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141b; --card: #161d26; --band: #1c2530; --ink: #e4e9f0; --muted: #98a4b5;
    --rule: #2a3441; --accent: #a9c2ec; --on-accent: #0f141b; --accent-soft: #1f2b3d;
    --again: #e5867c; --hard: #dcaa55; --easy: #80c493; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141b; --card: #161d26; --band: #1c2530; --ink: #e4e9f0; --muted: #98a4b5;
  --rule: #2a3441; --accent: #a9c2ec; --on-accent: #0f141b; --accent-soft: #1f2b3d;
  --again: #e5867c; --hard: #dcaa55; --easy: #80c493; color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.6 var(--f-body);
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--card);
}
a { color: var(--accent); text-underline-offset: 3px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.lbl {
  font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
}
.stamp {
  display: inline-block; font-family: var(--f-mono); font-size: 11.5px; font-weight: 500;
  letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
  border: 1px solid currentColor; border-radius: 2px; padding: 1px 6px; line-height: 1.5;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 8px 16px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  font-weight: 500; text-decoration: none; line-height: 1.25;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn.danger { color: var(--again); border-color: var(--again); }
kbd {
  font-family: var(--f-mono); font-size: 11px; padding: 0 5px; border-radius: 3px;
  border: 1px solid currentColor; opacity: .7;
}

/* Шапка */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--card); border-bottom: 1px solid var(--rule);
}
.top-in {
  max-width: 1240px; margin: 0 auto; height: var(--head-h);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 24px;
}
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand b { font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
.brand .stamp { font-size: 10.5px; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tabs a {
  text-decoration: none; color: var(--muted); font-weight: 500; padding: 8px 12px; border-radius: 4px;
}
.tabs a:hover { color: var(--ink); background: var(--band); }
.tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* Сетка */
.shell {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: grid; grid-template-columns: 296px minmax(0, 1fr); gap: 44px; align-items: start;
}
.shell.solo { grid-template-columns: minmax(0, 1fr); }
.shell.solo .rail { display: none; }
main { min-width: 0; }

/* Ящик с темами */
.rail {
  position: sticky; top: calc(var(--head-h) + env(safe-area-inset-top, 0px) + 20px);
  max-height: calc(100vh - var(--head-h) - 40px); overflow: auto; overscroll-behavior: contain;
  padding-right: 4px;
}
.era { margin-bottom: 18px; }
.era-h { display: flex; justify-content: space-between; gap: 8px; padding: 0 8px 6px; border-bottom: 1px solid var(--rule); margin-bottom: 4px; }
.era-h .lbl { color: var(--ink); }
.era-h .mono { font-size: 11.5px; color: var(--muted); }
.ti {
  display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 8px; align-items: baseline;
  padding: 7px 8px; border-radius: 4px; text-decoration: none; color: var(--ink);
}
.ti:hover { background: var(--band); }
.ti[aria-current="page"] { background: var(--accent-soft); }
.ti .num { font-family: var(--f-mono); font-size: 12.5px; color: var(--accent); }
.ti .tt { font-size: 14.5px; line-height: 1.35; }
.ti .pr { grid-column: 2; display: flex; align-items: center; gap: 8px; }
.bar { flex: 1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.ti .pr .mono { font-size: 11px; color: var(--muted); }

/* Обзор */
.hero h1, .topic h1, .guide h1 {
  font-family: var(--f-display); font-weight: 600; letter-spacing: -.015em; line-height: 1.2;
  font-size: clamp(24px, 3.4vw, 34px); margin: 10px 0 12px;
}
.hero p.lead { font-size: 17px; max-width: 62ch; color: var(--ink); margin: 0 0 20px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stats {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 28px 0;
  border: 1px solid var(--rule); border-radius: 4px; background: var(--card);
}
.stats > div { padding: 14px 16px; border-left: 1px solid var(--rule); }
.stats > div:first-child { border-left: 0; }
.stats b { display: block; font-family: var(--f-mono); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
.crit-table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--rule); border-radius: 4px; }
.crit-table th, .crit-table td { text-align: left; vertical-align: top; padding: 12px 14px; border-top: 1px solid var(--rule); }
.crit-table thead th { border-top: 0; background: var(--band); }
.crit-table td.pts { font-family: var(--f-mono); white-space: nowrap; }
.table-wrap { overflow-x: auto; }
.inline-list { display: none; margin-top: 28px; }
h2.sec { font-family: var(--f-display); font-weight: 500; font-size: 19px; margin: 36px 0 14px; letter-spacing: -.01em; }

/* Тема */
.topic { max-width: 760px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; color: var(--muted); font-size: 14px; }
.official { color: var(--muted); margin: 0 0 24px; font-size: 15px; max-width: 70ch; }
.official .lbl { margin-right: 6px; }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 18px 20px; margin: 0 0 18px; }
.panel > .lbl { display: block; margin-bottom: 8px; }
.gist p { margin: 0; font-size: 17px; }
.plan ol { margin: 0; padding-left: 22px; }
.plan li { padding-left: 4px; margin: 3px 0; }
.plan li::marker { font-family: var(--f-mono); color: var(--accent); }
.body { margin: 30px 0; }
.body h3 { font-size: 19px; font-weight: 600; margin: 28px 0 8px; }
.body p { margin: 0 0 12px; }
.body ul, .body ol { margin: 0 0 14px; padding-left: 22px; }
.body li { margin: 4px 0; }
.body b { font-weight: 600; }
.block { margin: 32px 0; }
.block > h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.crit { font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em; text-transform: none; color: var(--accent); border: 1px solid currentColor; border-radius: 2px; padding: 0 6px; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: minmax(118px, 168px) minmax(0, 1fr); gap: 16px; padding: 8px 0; border-bottom: 1px dashed var(--rule); }
.timeline .d { font-family: var(--f-mono); font-size: 14px; color: var(--accent); font-variant-numeric: tabular-nums; }
.defs { margin: 0; }
.defs dt { font-weight: 600; margin-top: 12px; }
.defs dd { margin: 2px 0 0; color: var(--ink); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 36px; }
.docs ul { list-style: none; padding: 0; margin: 0; }
.docs li { padding: 10px 0; border-bottom: 1px dashed var(--rule); }
.docs li b { display: block; font-weight: 600; }
.world p { margin: 0; }
.topic-cta { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--rule); }
.back { display: none; margin-bottom: 8px; }

/* Карточки */
.study { max-width: 660px; margin: 0 auto; }
.deckbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.deckbar select {
  flex: 1 1 260px; min-width: 0; min-height: 42px; padding: 8px 10px; border-radius: 4px;
  border: 1px solid var(--rule); background: var(--card);
}
.kinds { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip {
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
  padding: 6px 10px; border-radius: 2px; border: 1px solid var(--rule); background: var(--card);
  color: var(--muted); cursor: pointer;
}
.chip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.counters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--rule); border-radius: 4px; background: var(--card); margin-bottom: 16px; }
.counters > div { text-align: center; padding: 10px 6px; border-left: 1px solid var(--rule); }
.counters > div:first-child { border-left: 0; }
.counters b { display: block; font-family: var(--f-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.counters .c-new .lbl, .counters .c-new b { color: var(--accent); }
.counters .c-learn .lbl, .counters .c-learn b { color: var(--hard); }
.counters .c-due .lbl, .counters .c-due b { color: var(--easy); }
.fcard { position: relative; background: var(--card); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.fc-head { display: flex; justify-content: space-between; gap: 12px; padding: 10px 18px; background: var(--band); border-bottom: 2px solid var(--accent); }
.fc-head .lbl { color: var(--ink); }
.fc-head .mono { font-size: 12px; color: var(--muted); white-space: nowrap; }
.fc-body { padding: 22px 22px 40px; min-height: 230px; }
.fc-body .q { font-size: clamp(20px, 3vw, 24px); font-weight: 600; line-height: 1.35; margin: 10px 0 0; text-wrap: pretty; }
.divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 14px; color: var(--muted); }
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1px dashed var(--rule); }
.ans p { margin: 0; font-size: 17px; }
.ans ol { margin: 0; padding-left: 24px; font-size: 17px; }
.ans li { margin: 4px 0; padding-left: 4px; }
.ans li::marker { font-family: var(--f-mono); color: var(--accent); }
.steps.days > li { grid-template-columns: minmax(0, 1fr); }
.steps.days > li::before { content: none; }
.days > li.now { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.days p { margin: 6px 0 0; max-width: none; }
.days .meta { display: block; margin-top: 6px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.hole { position: absolute; left: 50%; bottom: 10px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--paper); border: 1px solid var(--rule); }
.actions { margin-top: 14px; }
.actions .wide { width: 100%; min-height: 52px; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grade {
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; padding: 8px 4px;
  border-radius: 4px; border: 1px solid var(--rule); background: var(--card); cursor: pointer; font-weight: 600;
}
.grade small { font-family: var(--f-mono); font-size: 12px; font-weight: 400; color: var(--muted); }
.grade[data-g="1"] { color: var(--again); }
.grade[data-g="2"] { color: var(--hard); }
.grade[data-g="3"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.grade[data-g="3"] small { color: var(--on-accent); opacity: .8; }
.grade[data-g="4"] { color: var(--easy); }
.grade:hover { border-color: currentColor; }
.fc-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; margin-top: 14px; font-size: 14px; color: var(--muted); }
.sync::before { content: "●"; margin-right: 6px; font-size: 10px; vertical-align: 2px; color: var(--muted); }
.sync[data-s="cloud"]::before { color: var(--easy); }
.sync[data-s="slow"]::before, .sync[data-s="error"]::before { color: var(--hard); }
.done { text-align: center; padding: 36px 22px 44px; }
.done h2 { font-family: var(--f-display); font-weight: 500; font-size: 22px; margin: 6px 0 8px; }
.done p { color: var(--muted); margin: 0 auto 18px; max-width: 46ch; }
.done .row { justify-content: center; }
details.settings { margin-top: 26px; border-top: 1px solid var(--rule); padding-top: 12px; }
details.settings summary { cursor: pointer; color: var(--muted); font-weight: 500; }
.set-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0; }
.set-row input { width: 90px; min-height: 40px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--card); }
.note { font-size: 14px; color: var(--muted); }

/* Гайд */
.guide { max-width: 760px; margin: 0 auto; }
.guide h2 { font-family: var(--f-display); font-weight: 500; font-size: 20px; margin: 40px 0 12px; letter-spacing: -.01em; }
.guide p, .guide li { max-width: 68ch; }
.guide ol, .guide ul { padding-left: 22px; }
.guide li { margin: 6px 0; }
.steps { counter-reset: s; list-style: none; padding: 0 !important; display: grid; gap: 10px; }
.steps > li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px; margin: 0; max-width: none; }
.steps > li::before { content: counter(s, decimal-leading-zero); font-family: var(--f-mono); color: var(--accent); font-size: 14px; padding-top: 2px; }
.gtable { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--rule); }
.gtable th, .gtable td { text-align: left; vertical-align: top; padding: 10px 12px; border-top: 1px solid var(--rule); }
.gtable thead th { border-top: 0; background: var(--band); }
.gtable td:first-child { white-space: nowrap; font-weight: 600; }

/* Случайный билет */
.overlay {
  position: fixed; inset: 0; z-index: 40; background: rgba(10, 16, 24, .55);
  display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.ticket { width: min(640px, 100%); max-height: 100%; overflow: auto; background: var(--card); border: 1px solid var(--rule); border-radius: 4px; }
.ticket-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 10px 18px; background: var(--band); border-bottom: 2px solid var(--accent); }
.ticket-in { padding: 16px 20px 20px; }
.ticket h2 { font-family: var(--f-display); font-weight: 500; font-size: 20px; margin: 0 0 12px; }
.tq { list-style: none; padding: 0; margin: 0 0 14px; }
.tq > li { padding: 14px 0; border-bottom: 1px dashed var(--rule); }
.tq .mono { font-size: 12.5px; color: var(--accent); }
.tq p { margin: 4px 0 8px; font-weight: 500; }
.tq details summary { cursor: pointer; color: var(--accent); font-size: 14.5px; }
.tq details ol { margin: 8px 0 0; padding-left: 20px; font-size: 15px; }
.x { width: 40px; height: 40px; border: 0; background: transparent; cursor: pointer; font-size: 24px; line-height: 1; color: var(--muted); border-radius: 4px; }
.x:hover { background: var(--card); color: var(--ink); }

/* Нижние вкладки (телефон) */
.tabbar { display: none; }

@media (max-width: 900px) {
  :root { --tab-h: 62px; --head-h: 54px; }
  .tabs, .top .rnd-wide { display: none; }
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding-block: 18px 40px; }
  .rail { display: none; }
  .inline-list { display: block; }
  .back { display: inline-flex; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats > div:nth-child(3) { border-left: 0; }
  .stats > div:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .tabbar {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--card); border-top: 1px solid var(--rule);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(8px, env(safe-area-inset-left, 0px));
    padding-right: max(8px, env(safe-area-inset-right, 0px));
  }
  .tabbar a {
    height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    text-decoration: none; color: var(--muted); font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  }
  .tabbar a[aria-current="page"] { color: var(--accent); }
  .tabbar svg { width: 22px; height: 22px; }
  .timeline li { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .fc-body { padding: 18px 16px 38px; min-height: 200px; }
  .fc-head { padding: 9px 14px; }
}
@media (min-width: 901px) { .top .rnd-narrow { display: none; } }
@media (max-width: 420px) {
  .brand .stamp { display: none; }
  .grade { font-size: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .ans:not([hidden]) { animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#topics"><b>История России</b><span class="stamp">экзамен · 26 тем</span></a>
    <nav class="tabs" aria-label="Разделы">
      <a href="#topics" data-tab="topics">Темы</a>
      <a href="#cards" data-tab="cards">Карточки</a>
      <a href="#guide" data-tab="guide">Как учить</a>
    </nav>
    <button class="btn rnd-wide" type="button" data-ticket>Случайный билет</button>
    <button class="btn quiet rnd-narrow" type="button" data-ticket style="margin-left:auto">Билет</button>
  </div>
</header>

<div class="shell" id="shell">
  <aside class="rail" id="rail" aria-label="Темы экзамена"></aside>
  <main id="main"></main>
</div>

<nav class="tabbar" aria-label="Разделы">

<p>По переписи 1897 г. в империи жило около 126 млн человек, из них примерно четыре пятых — крестьяне, в городах — лишь около 13 %. Экономика была <b>многоукладной</b>: рядом существовали крупная монополистическая промышленность, мелкотоварное крестьянское хозяйство, помещичьи латифундии и даже натуральное хозяйство окраин.</p>

<p>Кульминация — <b>Декабрьское вооружённое восстание в Москве</b> (7–19 декабря), центром которого стала Пресня. Оно было подавлено с помощью Семёновского полка, переброшенного из Петербурга. 11 декабря издан избирательный закон о выборах в Думу (по куриям, непрямые и неравные выборы).</p>

<p>В современной отечественной историографии (историко-культурный стандарт) события 1917–1922 гг. рассматриваются как единый процесс — <b>Великая российская революция</b>, по аналогии с Великой французской. Её этапы: <b>Февраль 1917 г.</b> — свержение самодержавия; <b>март–октябрь 1917 г.</b> — двоевластие и кризисы Временного правительства; <b>Октябрь 1917 г.</b> — приход к власти большевиков; <b>1918–1922 гг.</b> — становление советской власти и Гражданская война.</p>
<h3>Причины</h3>
<p>Глубинные причины те же, что в 1905 г.: нерешённые аграрный, рабочий, национальный вопросы и архаичная политическая система. Добавились тяготы войны: миллионы погибших, инфляция, нехватка хлеба в городах, развал транспорта; падение авторитета Николая II и правительства, конфликт власти с Думой и общественностью. Характер Февраля — <b>буржуазно-демократический</b>.</p>
<h3>Свержение самодержавия</h3>
<p><b>23 февраля 1917 г.</b> (8 марта по н. ст.) в Петрограде начались забастовки и демонстрации работниц из-за хлебных очередей. 25 февраля стачка стала всеобщей, 26 февраля войска стреляли в демонстрантов. <b>27 февраля</b> на сторону восставших перешли запасные полки (первым — учебная команда Волынского полка): этот день считают днём победы революции. Возникли два центра власти: <b>Временный комитет Государственной думы</b> (М.В. Родзянко) и <b>Петроградский Совет рабочих и солдатских депутатов</b> (во главе исполкома — меньшевик Н.С. Чхеидзе).</p>
<p>1 марта Петросовет издал <b>Приказ № 1</b>: создание солдатских комитетов, подчинение воинских частей Совету в политических вопросах — это подорвало дисциплину в армии. <b>2 марта</b> в Пскове Николай II отрёкся от престола за себя и сына в пользу брата Михаила Александровича; в тот же день образовано <b>Временное правительство</b> во главе с князем Г.Е. Львовым (Милюков — иностранные дела, Гучков — военный министр, Керенский — юстиция). 3 марта Михаил отказался принять власть до решения Учредительного собрания. Монархия в России пала.</p>
<h3>Двоевластие</h3>
<p>Временное правительство имело формальную власть, но реальная опора — солдаты и рабочие — шла за Советом. Это и называют <b>двоевластием</b>. Правительство объявило амнистию, свободы, отменило сословные, вероисповедные и национальные ограничения, обещало созвать <b>Учредительное собрание</b>. Но главные вопросы — о мире, земле и форме правления — откладывались до Учредительного собрания. 3 апреля в Петроград вернулся В.И. Ленин и выдвинул <b>«Апрельские тезисы»</b>: никакой поддержки Временному правительству, «Вся власть Советам!», переход к социалистической революции.</p>
<h3>Три кризиса власти</h3>
<p><b>Апрельский кризис</b> (18–21 апреля). Нота министра иностранных дел Милюкова союзникам о войне «до решительной победы» вызвала массовые демонстрации. Милюков и Гучков ушли в отставку, 5 мая создано <b>первое коалиционное правительство</b> с участием эсеров и меньшевиков; Керенский стал военным министром.</p>
<p><b>Июньский кризис.</b> На I Всероссийском съезде Советов (июнь) большинство было за эсерами и меньшевиками, но демонстрация 18 июня прошла под большевистскими лозунгами («Долой десять министров-капиталистов!»). В тот же день началось наступление на фронте, вскоре провалившееся.</p>
<p><b>Июльский кризис</b> (3–5 июля). Вооружённые демонстрации солдат и матросов в Петрограде были разогнаны, большевиков обвинили в попытке захвата власти и шпионаже в пользу Германии, Ленин скрылся (Разлив). Двоевластие закончилось в пользу правительства, Советы во главе с эсерами и меньшевиками его поддержали. Министром-председателем стал <b>А.Ф. Керенский</b>, на фронте восстановили смертную казнь.</p>
<h3>Корниловский мятеж</h3>
<p>Верховный главнокомандующий генерал <b>Л.Г. Корнилов</b> требовал «твёрдой власти»: смертной казни в тылу, запрета митингов в армии, милитаризации железных дорог. На Московском государственном совещании (август) правые встретили его как спасителя. <b>25–27 августа</b> Корнилов направил 3-й конный корпус генерала А.М. Крымова на Петроград. Керенский, сначала колебавшийся, объявил Корнилова мятежником. На защиту города встали Советы, большевики, Красная гвардия; агитаторы распропагандировали войска, и к 31 августа выступление провалилось. Крымов застрелился, Корнилов был арестован.</p>
<p>Последствия: правые силы и армейское командование деморализованы, Керенский потерял поддержку и справа, и слева, большевики реабилитированы и вооружены. Началась <b>большевизация Советов</b>: в сентябре Петросовет возглавил Л.Д. Троцкий. 1 сентября Россия провозглашена <b>республикой</b>. Так сложились условия для Октября.</p>
`,

body: `
<h3>Подготовка восстания</h3>
<p>После Корниловского мятежа большевики получили большинство в Петроградском и Московском Советах. Ленин из подполья требовал немедленного восстания («Большевики должны взять власть»). <b>10 октября 1917 г.</b> ЦК РСДРП(б) принял резолюцию о вооружённом восстании; против выступили Л.Б. Каменев и Г.Е. Зиновьев, которые 18 октября изложили свою позицию в газете «Новая жизнь», фактически раскрыв план. <b>12 октября</b> при Петросовете создан <b>Военно-революционный комитет (ВРК)</b>; его фактическим руководителем был Л.Д. Троцкий, в штаб входили Н.И. Подвойский и В.А. Антонов-Овсеенко.</p>
<h3>Ход восстания</h3>
<p>24 октября правительство попыталось закрыть большевистские газеты и развести мосты. В ответ отряды Красной гвардии, солдаты и матросы ВРК в ночь на 25 октября почти бескровно заняли мосты, вокзалы, телеграф, телефонную станцию, Государственный банк. Ленин прибыл в Смольный. Утром <b>25 октября</b> ВРК издал воззвание «К гражданам России!» о переходе власти к Советам. Керенский уехал из города за войсками. Вечером прозвучал сигнальный выстрел крейсера «Аврора», а в ночь на <b>26 октября</b> Зимний дворец был взят и министры Временного правительства арестованы. Попытка Керенского и генерала П.Н. Краснова вернуть столицу провалилась под Пулковом. В Москве бои шли около недели и закончились 2–3 ноября.</p>
<h3>II Всероссийский съезд Советов</h3>
<p>Съезд открылся вечером 25 октября в Смольном. Меньшевики и правые эсеры осудили восстание и ушли, большевики и левые эсеры остались в большинстве. Приняты:</p>
<ul>
<li><b>Декрет о мире</b> — призыв ко всем воюющим странам заключить демократический мир без аннексий и контрибуций.</li>
<li><b>Декрет о земле</b> — отмена частной собственности на землю, конфискация помещичьих земель без выкупа, уравнительное землепользование. Его основой стал эсеровский «Крестьянский наказ» из 242 местных наказов, поэтому крестьяне его поддержали.</li>
<li>Создан <b>Совет народных комиссаров (СНК)</b> во главе с В.И. Лениным — правительство; избран ВЦИК (с ноября его возглавил Я.М. Свердлов).</li>
</ul>
<h3>Установление власти на местах</h3>
<p>С октября 1917 по март 1918 г. советская власть установилась в большинстве губерний, в промышленных центрах — быстро и мирно. Этот период назвали «триумфальным шествием Советской власти». Вооружённое сопротивление оказали Москва, казачьи области Дона (атаман А.М. Каледин) и Оренбурга (А.И. Дутов), Украинская Центральная рада.</p>
<h3>Первые преобразования</h3>
<ul>
<li><b>Государство</b>: Декрет о печати (закрытие оппозиционных газет), создание <b>ВЧК</b> во главе с Ф.Э. Дзержинским (7 декабря 1917), Рабоче-крестьянской Красной армии (январь 1918), слом старого суда и армии.</li>
<li><b>Национальный вопрос</b>: Декларация прав народов России (2 ноября 1917) — равенство и право на самоопределение вплоть до отделения; признана независимость Финляндии.</li>
<li><b>Общество</b>: Декрет о 8-часовом рабочем дне, отмена сословий и чинов (10 ноября), гражданский брак, равноправие женщин.</li>
<li><b>Экономика</b>: рабочий контроль, создание ВСНХ (декабрь 1917), национализация банков, железных дорог, внешней торговли; в июне 1918 — всей крупной промышленности.</li>
<li><b>Церковь</b>: Декрет об отделении церкви от государства и школы от церкви (январь 1918).</li>
<li><b>Календарь</b>: переход на григорианский календарь — после 31 января 1918 г. сразу наступило 14 февраля.</li>
</ul>
<h3>Учредительное собрание и Брестский мир</h3>
<p>На выборах в ноябре 1917 г. эсеры получили около 40 % голосов, большевики — около четверти. Собрание открылось <b>5 января 1918 г.</b> (председатель — эсер В.М. Чернов) и отказалось признать декреты Советской власти. На следующий день оно было разогнано («Караул устал» — матрос А.Г. Железняков). III съезд Советов провозгласил Российскую Советскую Республику. <b>3 марта 1918 г.</b> подписан тяжёлый <b>Брестский мир</b>; в знак протеста левые эсеры вышли из СНК, а в июле 1918 г. подняли мятеж. В июле 1918 г. V съезд Советов принял <b>первую Конституцию РСФСР</b>, закрепившую диктатуру пролетариата: «эксплуататоры» лишались избирательных прав, рабочие имели преимущество перед крестьянами.</p>
<h3>Причины и социально-классовые корни Гражданской войны</h3>
<ul>
<li>Глубокий раскол общества: бывшие имущие слои (помещики, буржуазия, офицерство, чиновники, духовенство) лишились собственности и положения.</li>
<li>Разгон Учредительного собрания лишил большевиков легитимности в глазах демократов, однопартийная диктатура не оставила оппозиции легальных путей.</li>
<li>Брестский мир оскорбил патриотические чувства офицерства и интеллигенции.</li>
<li>Продовольственная диктатура весны–лета 1918 г. (продотряды, комбеды) настроила против власти значительную часть крестьянства.</li>
<li>Стремление национальных окраин к независимости; казачество защищало свои привилегии.</li>
<li>Иностранная интервенция и восстание Чехословацкого корпуса (май 1918).</li>
<li>Привычка к насилию и обесценивание жизни после мировой войны.</li>
</ul>
`,

<h3>Военный коммунизм (1918–1921)</h3>
<p>Политика чрезвычайных мер, вызванная войной и представлениями большевиков о прямом переходе к коммунизму без рынка и денег:</p>

<li>Свобода торговли, легализация частного предпринимательства, аренда и денационализация мелких предприятий, концессии для иностранцев.</li>
<li>Перевод госпредприятий на <b>хозрасчёт</b>, объединение их в тресты и синдикаты.</li>
<li>Отмена трудовой повинности, свободный наём, сдельная оплата.</li>

<li>Государство сохранило <b>«командные высоты»</b>: крупную промышленность, транспорт, банки, монополию внешней торговли.</li>
</ul>
<h3>Результаты и противоречия</h3>
<p>К 1926–1927 гг. в основном был достигнут довоенный уровень промышленного и сельскохозяйственного производства, исчезли голод и карточки, вырос уровень жизни. Однако НЭП порождал кризисы: «кризис сбыта» 1923 г. («ножницы цен» — разрыв между высокими ценами на промтовары и низкими на хлеб), безработица, расслоение деревни, рост нэпманов, которых коммунисты воспринимали как классового врага. Главное противоречие — <b>рыночная экономика при однопартийной диктатуре</b> и идеологии, отвергающей частную собственность.</p>
<h3>Свёртывание НЭПа</h3>
<p>Курс на индустриализацию (XIV съезд, 1925) требовал огромных средств, которые можно было взять прежде всего в деревне. Зимой 1927–1928 гг. разразился <b>кризис хлебозаготовок</b>: крестьяне не хотели сдавать хлеб по низким государственным ценам. Сталин в Сибири применил «чрезвычайные меры» (конфискация хлеба по ст. 107 УК). Сторонники НЭПа во главе с Н.И. Бухариным, А.И. Рыковым и М.П. Томским были объявлены «правым уклоном» и разгромлены в 1929 г. Другие причины: «военная тревога» 1927 г., «Шахтинское дело» 1928 г. и поиск «вредителей». 1929 г. Сталин назвал «годом великого перелома»; к началу 1930-х частная торговля и предпринимательство были ликвидированы.</p>
<h3>Образование СССР</h3>
<p>После Гражданской войны на территории бывшей империи существовали РСФСР, Украинская, Белорусская ССР и Закавказская федерация, связанные военно-политическим союзом. Обсуждались два проекта:</p>
<ul>
<li><b>«Автономизация»</b> И.В. Сталина (нарком по делам национальностей): вхождение республик в РСФСР на правах автономий.</li>
<li><b>Федерация</b> В.И. Ленина: союз равноправных республик с правом свободного выхода.</li>
</ul>
<p>Победил ленинский проект. <b>30 декабря 1922 г.</b> I Всесоюзный съезд Советов утвердил Декларацию и Договор об образовании Союза Советских Социалистических Республик в составе РСФСР, УССР, БССР и ЗСФСР. <b>31 января 1924 г.</b> II съезд Советов утвердил <b>первую Конституцию СССР</b>: высший орган — Съезд Советов СССР, между съездами — двухпалатный ЦИК (Совет Союза и Совет Национальностей), правительство — СНК СССР. Реальная власть принадлежала единой централизованной партии, поэтому федерация была во многом формальной. В 1924–1925 гг. в Средней Азии провели национально-территориальное размежевание (Узбекская и Туркменская ССР), проводилась политика «коренизации» — выдвижения национальных кадров и развития национальных языков.</p>
<h3>Международное положение в 1920-е годы</h3>
<p>Внешняя политика сочетала две линии: дипломатию «мирного сосуществования» (нарком Г.В. Чичерин) и поддержку мировой революции через <b>Коминтерн</b> (1919). На <b>Генуэзской конференции</b> (апрель 1922) Запад требовал вернуть царские долги и национализированную собственность; советская сторона выдвинула встречные претензии за ущерб от интервенции. Прорыв изоляции — <b>Рапалльский договор с Германией</b> (16 апреля 1922): восстановление отношений, взаимный отказ от претензий, позже — военно-техническое сотрудничество. 1924 г. стал <b>«полосой признания»</b>: СССР признали Великобритания, Италия, Франция, Китай и др.; Япония — в 1925 г., США — лишь в 1933 г. Были и кризисы: «ультиматум Керзона» (1923), разрыв отношений с Великобританией и «военная тревога» 1927 г., конфликт на КВЖД (1929).</p>

<h3>Идеология и повседневность</h3>
<p>В литературе и искусстве утвердился метод <b>социалистического реализма</b> (I съезд Союза советских писателей, 1934). В 1938 г. вышел «Краткий курс истории ВКП(б)» — канон официальной истории. С середины 1930-х идеология повернула от интернационализма к советскому патриотизму: возобновлено преподавание истории в школе, реабилитированы исторические герои (Александр Невский, Суворов), укреплялась семья (запрет абортов 1936 г.). Церковь подвергалась гонениям. Повседневность — коммуналки, очереди, карточки до 1935 г., но и массовый энтузиазм, вера в лучшее будущее, социальные лифты.</p>
<p><b>Итог</b>: за 1930-е гг. революционное государство превратилось в мобилизационную систему с жёстким централизмом, культом вождя и массовым принуждением. Она обеспечила рывок индустриализации и мобилизацию в войне, но ценой миллионов жертв и подавления свободы.</p>

<h3>Сталинградская битва (17 июля 1942 – 2 февраля 1943)</h3>
<p><b>Оборонительный этап</b>: тяжёлые бои за каждый дом; 62-я армия В.И. Чуйкова удерживала узкую полосу у Волги, легендой стал «Дом Павлова», шли бои за Мамаев курган. <b>Наступательный этап</b>: 19 ноября 1942 г. началась операция <b>«Уран»</b> — удары Юго-Западного (Н.Ф. Ватутин), Донского (К.К. Рокоссовский) и Сталинградского (А.И. Ерёменко) фронтов. 23 ноября у Калача кольцо замкнулось вокруг 6-й армии Ф. Паулюса (около 330 тыс. человек). Попытку деблокады группой Э. Манштейна отбили в декабре. Операция «Кольцо» завершилась пленением Паулюса (31 января) и капитуляцией северной группы <b>2 февраля 1943 г.</b></p>
<p><b>Значение</b>: начало коренного перелома, тяжелейшее поражение Германии, траур в рейхе, кризис фашистского блока; началось массовое изгнание врага с территории СССР. В январе 1943 г. операция «Искра» прорвала блокаду Ленинграда.</p>
<h3>Курская битва (5 июля – 23 августа 1943)</h3>
<p>Германия планировала операцию <b>«Цитадель»</b> — срезать Курский выступ ударами с севера и юга, применив новые танки «Тигр» и «Пантера». Советское командование, зная планы, перешло к преднамеренной обороне силами Центрального (Рокоссовский) и Воронежского (Ватутин) фронтов, имея резервы Степного фронта (И.С. Конев). <b>12 июля</b> у <b>Прохоровки</b> произошло одно из крупнейших танковых сражений. Затем началось контрнаступление: <b>5 августа</b> освобождены Орёл и Белгород (в их честь в Москве дан первый салют), 23 августа — Харьков. Курская битва <b>завершила коренной перелом</b>: вермахт больше не проводил стратегических наступлений на Востоке.</p>
<p>Осенью 1943 г. развернулась <b>битва за Днепр</b>: форсирование реки, «Восточный вал» противника прорван, <b>6 ноября 1943 г.</b> освобождён Киев. К концу 1943 г. освобождено около половины оккупированной территории.</p>
<h3>Партизанское движение и подполье</h3>
<p>В тылу врага действовали партизанские отряды и подполье. 30 мая 1942 г. создан <b>Центральный штаб партизанского движения</b> (П.К. Пономаренко). Крупные операции 1943 г. — <b>«Рельсовая война»</b> и <b>«Концерт»</b> — подрыв железных дорог для срыва перевозок противника. Прославились рейды соединения С.А. Ковпака, подвиг Зои Космодемьянской, краснодонская «Молодая гвардия». Оккупанты отвечали карательными операциями и сожжением деревень (Хатынь). Существовал и коллаборационизм: полицаи, «Русская освободительная армия» генерала А.А. Власова.</p>
<h3>Советский тыл</h3>
<p>Экономика перешла на военные рельсы под лозунгом <b>«Всё для фронта, всё для победы!»</b>. Эвакуированные заводы запускались на Урале, в Сибири и Средней Азии иногда за недели; Урал стал главной кузницей оружия. Введены обязательные сверхурочные работы, отменены отпуска, карточки; на заводах трудились женщины, подростки, старики. В 1943 г. СССР выпускал больше танков и самолётов, чем Германия. Население собирало средства в Фонд обороны. Союзники поставляли технику, грузовики, продовольствие по <b>ленд-лизу</b> — важное, хотя и не решающее дополнение к собственному производству.</p>
<p>Наука работала на оборону (с 1943 г. — атомный проект И.В. Курчатова). Культура поддерживала дух: песня «Священная война», стихотворение К. Симонова «Жди меня», поэма А. Твардовского «Василий Тёркин», Седьмая («Ленинградская») симфония Д. Шостаковича, исполненная в блокадном городе 9 августа 1942 г. Власть смягчила отношение к церкви: в сентябре 1943 г. избран патриарх Сергий.</p>
<h3>«Большая тройка»</h3>

<li><b>Ялтинская (Крымская) конференция</b> (4–11 февраля 1945): оккупация и раздел Германии на зоны, её демилитаризация и денацификация, репарации; создание ООН; вступление СССР в войну с Японией через 2–3 месяца после победы в Европе с возвращением Южного Сахалина и передачей Курил; восточная граница Польши — по «линии Керзона».</li>

<li><b>Доктрина Трумэна</b> (март 1947 г.): курс на «сдерживание» коммунизма, помощь Греции и Турции.</li>

<li><b>Берлинский кризис 1948–1949 гг.</b>: в ответ на денежную реформу в западных зонах СССР блокировал Западный Берлин, США снабжали город по «воздушному мосту». Итог — раскол Германии: ФРГ (сентябрь 1949) и ГДР (октябрь 1949).</li>
<li>Создание <b>НАТО</b> (4 апреля 1949 г.); советская атомная бомба (август 1949); победа коммунистов в Китае (КНР, 1 октября 1949).</li>
</ul>

<li><b>Индокитай</b>: война Вьетнама за независимость от Франции (1946–1954) закончилась Женевскими соглашениями и разделом страны.</li>

<p><b>5 марта 1953 г.</b> умер И.В. Сталин. Власть перешла к «коллективному руководству»: Г.М. Маленков стал председателем Совета министров, Л.П. Берия возглавил объединённое МВД, Н.С. Хрущёв руководил аппаратом ЦК (с сентября 1953 г. — Первый секретарь ЦК). Берия выступил с рядом инициатив: <b>амнистия 27 марта 1953 г.</b> (освобождено около 1,2 млн человек, в основном осуждённых за неполитические преступления), прекращение «дела врачей», выдвижение национальных кадров. Опасаясь его усиления, соратники в июне 1953 г. арестовали Берию; в декабре он был расстрелян.</p>

<h3>Социальная политика</h3>

<p>Название дала повесть И.Г. Эренбурга «Оттепель» (1954). Ослабли страх и цензура: журнал «Новый мир» А.Т. Твардовского опубликовал «Один день Ивана Денисовича» А.И. Солженицына (1962); на поэтических вечерах в Политехническом выступали шестидесятники Е. Евтушенко, А. Вознесенский, Б. Ахмадулина, Р. Рождественский; фильм «Летят журавли» М. Калатозова получил «Золотую пальмовую ветвь» (1958); в Москве прошёл VI Всемирный фестиваль молодёжи и студентов (1957). Расширились контакты с Западом.</p>

<p>Непоследовательные реформы, частые реорганизации (разделение обкомов на промышленные и сельские, ротация кадров), импульсивный стиль («волюнтаризм») восстановили против Хрущёва номенклатуру. <b>14 октября 1964 г.</b> Пленум ЦК освободил его от должностей «по состоянию здоровья». Это был первый в советской истории мирный уход лидера — сам по себе результат десталинизации.</p>

<p>До войны советские спортсмены почти не участвовали в международных соревнованиях. После 1945 г. руководство решило, что спортивные победы доказывают преимущества социализма. С 1946 г. СССР вступал в международные федерации, в 1951 г. создан Олимпийский комитет СССР, признанный МОК. На первой для СССР <b>Олимпиаде в Хельсинки (1952)</b> команда завоевала 22 золотые медали и заняла второе место в неофициальном зачёте после США. Первой олимпийской чемпионкой СССР стала метательница диска <b>Нина Ромашкова (Пономарёва)</b>. Уже в <b>Мельбурне (1956)</b> СССР стал первым в командном зачёте, а на дебютной зимней Олимпиаде в Кортина-д'Ампеццо (1956) тоже вышел на первое место.</p>
<h3>Массовый спорт</h3>
<p>Система массовой физкультуры включала комплекс <b>ГТО</b> («Готов к труду и обороне», введён в 1931 г., обновлён в 1972 г.), добровольные спортивные общества (ДСО: «Динамо», ЦСКА, «Спартак», «Локомотив», «Труд»), детско-юношеские спортивные школы с бесплатными секциями, Спартакиады народов СССР (с 1956 г.), производственную гимнастику. Отбор талантов шёл по всей стране, тренерская школа считалась одной из лучших в мире.</p>
<h3>Олимпийские достижения</h3>
<ul>
<li><b>Лариса Латынина</b> (гимнастика) — 18 олимпийских медалей, из них 9 золотых (1956–1964), рекорд, державшийся почти полвека.</li>
<li><b>Владимир Куц</b> — победитель на 5000 и 10 000 м (Мельбурн, 1956).</li>
<li><b>Юрий Власов</b> и <b>Василий Алексеев</b> — штангисты, «самые сильные люди планеты».</li>
<li><b>Валерий Брумель</b> — рекорды в прыжках в высоту (1961–1963), олимпийский чемпион 1964 г.</li>
<li><b>Лидия Скобликова</b> — шесть золотых медалей в конькобежном спорте (1960, 1964).</li>
<li><b>Валерий Борзов</b> — победитель на 100 и 200 м (Мюнхен, 1972).</li>
<li><b>Ольга Корбут</b> и <b>Нелли Ким</b> — звёзды гимнастики 1970-х; <b>Николай Андрианов</b> — 15 олимпийских медалей.</li>
<li><b>Ирина Роднина</b> — трёхкратная олимпийская чемпионка в парном фигурном катании (1972, 1976, 1980).</li>
<li><b>Александр Тихонов</b> — четырёхкратный олимпийский чемпион в биатлонной эстафете.</li>
</ul>
<h3>Игровые виды и шахматы</h3>
<p><b>Хоккей</b>: в 1954 г. сборная СССР в дебютном чемпионате мира обыграла канадцев и стала чемпионом (В. Бобров); затем десятилетиями доминировала (тренеры А. Тарасов, В. Тихонов; игроки В. Третьяк, В. Харламов, Б. Михайлов). <b>Суперсерия 1972 г.</b> против звёзд НХЛ стала событием холодной войны; канадцы выиграли с минимальным перевесом. В 1980 г. в Лейк-Плэсиде сборная неожиданно уступила студентам США («чудо на льду»).</p>
<p><b>Футбол</b>: олимпийское золото (1956), победа в первом Кубке Европы (1960); <b>Лев Яшин</b> — единственный вратарь — обладатель «Золотого мяча» (1963). <b>Баскетбол</b>: в финале Олимпиады-1972 сборная СССР впервые обыграла американцев (бросок А. Белова за 3 секунды до конца). <b>Шахматы</b>: советская шахматная школа дала чемпионов мира М. Ботвинника, В. Смыслова, М. Таля, Т. Петросяна, Б. Спасского, А. Карпова; поражение Спасского от американца Р. Фишера (1972) воспринималось как политическое событие.</p>
<h3>Олимпиада-80</h3>
<p>Летние Олимпийские игры прошли в Москве (19 июля – 3 августа 1980 г.) — первые в социалистической стране. Из-за ввода советских войск в Афганистан США и ряд других государств их бойкотировали. Сборная СССР завоевала 80 золотых медалей. Символом Игр стал Мишка. В ответ СССР и большинство соцстран бойкотировали Олимпиаду 1984 г. в Лос-Анджелесе.</p>
<h3>Проблемы</h3>
<ul>
<li><b>Политизация</b>: спорт как «витрина социализма» и инструмент холодной войны, бойкоты.</li>
<li><b>«Государственные любители»</b>: формально спортсмены считались любителями, фактически получали ставки в армии, на заводах, в институтах — по сути профессионалы.</li>
<li><b>Допинг</b>: в 1970–1980-е гг. стимуляторы применялись в спорте многих стран, в том числе в СССР, что ставит под сомнение часть рекордов.</li>
<li>Невозвращенцы среди спортсменов, ограничение выездов, контроль КГБ.</li>
<li>Слабая база для массового спорта на селе и в малых городах, неравномерность: например, сборная по футболу так и не выиграла чемпионат мира.</li>
</ul>
`,

body: `
<h3>Предпосылки</h3>
<p>К середине 1980-х гг. СССР столкнулся с замедлением роста, технологическим отставанием, падением мировых цен на нефть, бременем гонки вооружений и войны в Афганистане, усталостью общества от «застоя». <b>Ю.В. Андропов</b> (1982–1984) пытался навести порядок «сверху»: укрепление дисциплины, борьба с коррупцией. После краткого правления <b>К.У. Черненко</b> (1984–1985) Генеральным секретарём <b>11 марта 1985 г.</b> избран 54-летний <b>М.С. Горбачёв</b>.</p>
<h3>«Ускорение» (1985–1986)</h3>
<p>Апрельский пленум ЦК 1985 г. провозгласил курс на <b>ускорение социально-экономического развития</b>: модернизация машиностроения, внедрение достижений НТП, укрепление дисциплины, государственная приёмка продукции. В мае 1985 г. началась <b>антиалкогольная кампания</b>, сократившая бюджетные доходы. Авария на <b>Чернобыльской АЭС 26 апреля 1986 г.</b> и попытки скрыть её масштабы показали пороки системы. Методы ускорения оказались старыми, и с 1987 г. (январский пленум ЦК) руководство заговорило о <b>перестройке</b> — глубоком реформировании всех сторон жизни.</p>
<h3>Экономические реформы</h3>
<ul>
<li>Закон об индивидуальной трудовой деятельности (1986).</li>
<li><b>Закон о государственном предприятии</b> (1987): хозрасчёт, самофинансирование, госзаказ вместо плана, выборы директоров трудовыми коллективами.</li>
<li><b>Закон о кооперации</b> (1988) легализовал частное предпринимательство в форме кооперативов; появились совместные с иностранцами предприятия, аренда.</li>
</ul>
<p>Реформы сочетали элементы рынка с сохранением плановой системы. Предприятия повышали зарплаты, не увеличивая выпуск товаров, бюджетный дефицит покрывался эмиссией, рос внешний долг. Результат — товарный <b>дефицит</b>, очереди, <b>талоны</b>, скрытая инфляция. Программа быстрого перехода к рынку «500 дней» (С.С. Шаталин, Г.А. Явлинский, 1990) не была принята. Реформы правительства В.С. Павлова (обмен крупных купюр и повышение цен в 1991 г.) ударили по населению.</p>
<h3>Политическая реформа</h3>
<p><b>XIX партийная конференция</b> (лето 1988) решила провести реформу политической системы: высшим органом власти стал <b>Съезд народных депутатов СССР</b>, выбиравший из своего состава постоянно действующий Верховный Совет; выборы стали альтернативными. <b>I Съезд народных депутатов</b> (май–июнь 1989) транслировался по телевидению и стал школой политики; возникла оппозиционная Межрегиональная депутатская группа (А.Д. Сахаров, Б.Н. Ельцин, Ю.Н. Афанасьев, Г.Х. Попов). <b>III Съезд (март 1990)</b> отменил <b>статью 6 Конституции</b> о руководящей роли КПСС, что открыло путь к многопартийности, и ввёл пост <b>Президента СССР</b>, на который съезд избрал Горбачёва. Шёл процесс реабилитации жертв репрессий (Бухарин и другие).</p>
<h3>Гласность</h3>
<p>Гласность — открытое обсуждение проблем и прошлого. Опубликованы запрещённые ранее произведения: «Дети Арбата» А. Рыбакова, «Жизнь и судьба» В. Гроссмана, «Доктор Живаго», «Архипелаг ГУЛАГ»; вышел фильм Т. Абуладзе «Покаяние». Заполнялись «белые пятна» истории: признан секретный протокол 1939 г., ответственность НКВД за Катынский расстрел. Сахаров вернулся из ссылки (1986), прекратилось глушение западного радио, острыми стали «Огонёк», «Московские новости», телепрограмма «Взгляд». <b>Закон о печати</b> (1990) отменил цензуру. КПСС утратила монополию на идеологию.</p>
<h3>Новое политическое мышление и конец холодной войны</h3>
<p>Принципы «нового мышления» (министр иностранных дел Э.А. Шеварднадзе): мир взаимозависим, <b>общечеловеческие ценности выше классовых</b>, отказ от силы, свобода выбора пути для каждого народа, баланс интересов. Шаги:</p>
<ul>
<li>Встречи Горбачёва и Р. Рейгана: Женева (1985), Рейкьявик (1986), Вашингтон — <b>Договор о ликвидации ракет средней и меньшей дальности</b> (РСМД, 8 декабря 1987 г.) — впервые уничтожался целый класс ядерного оружия.</li>
<li><b>Вывод советских войск из Афганистана</b> (завершён 15 февраля 1989 г.).</li>
<li>Отказ от «доктрины Брежнева» сделал возможными «бархатные революции» 1989 г. в Восточной Европе и <b>падение Берлинской стены</b> (9 ноября 1989 г.).</li>
<li>Встреча Горбачёва и Дж. Буша на <b>Мальте</b> (декабрь 1989) — заявление об окончании холодной войны.</li>
<li><b>Объединение Германии</b> (3 октября 1990 г.), Парижская хартия для новой Европы (1990), роспуск СЭВ и ОВД (1991), Договор СНВ-1 (июль 1991 г.).</li>
</ul>
<p>В 1990 г. Горбачёв получил Нобелевскую премию мира. Критики указывают, что уступки делались без юридических гарантий (например, о нерасширении НАТО на восток).</p>
<h3>Оценка</h3>
<p>Итоги перестройки противоречивы: свобода слова и совести, выборы, многопартийность, конец холодной войны и угрозы ядерного конфликта. Но экономика погрузилась в кризис, вспыхнули межнациональные конфликты, центр утратил контроль, и в 1991 г. Советский Союз распался (тема 22).</p>
`,

<p>По действовавшей Конституции 1978 г. с многочисленными поправками высшим органом власти был Съезд народных депутатов, но широкими полномочиями обладал и президент. Возникло противостояние: с одной стороны — Ельцин и правительство, с другой — Верховный Совет во главе с <b>Р.И. Хасбулатовым</b> и вице-президент <b>А.В. Руцкой</b>, критиковавшие реформы. На <b>референдуме 25 апреля 1993 г.</b> («да — да — нет — да») большинство участников выразили доверие президенту и его социально-экономической политике; досрочные выборы президента не поддержали. Летом работало Конституционное совещание, но компромисса не было.</p>
<h3>Трагические события осени 1993 г.</h3>
<p><b>21 сентября 1993 г.</b> Ельцин подписал <b>Указ № 1400</b> «О поэтапной конституционной реформе»: Съезд и Верховный Совет распускались, на 12 декабря назначались выборы в новый парламент — Федеральное собрание. Конституционный суд признал указ противоречащим Конституции, Верховный Совет объявил о прекращении полномочий Ельцина и назначил исполняющим обязанности президента Руцкого. Здание Верховного Совета (Белый дом) было блокировано.</p>
<p><b>3 октября</b> сторонники парламента прорвали оцепление, захватили здание мэрии и попытались штурмовать телецентр <b>«Останкино»</b>; погибли люди. Президент ввёл чрезвычайное положение. <b>4 октября</b> войска обстреляли Белый дом из танков, его защитники сдались, Хасбулатов и Руцкой были арестованы (в 1994 г. амнистированы). По официальным данным, погибли около 150 человек. Затем Советы всех уровней были распущены — <b>советская система власти прекратила существование</b>.</p>
<h3>Конституция 1993 г.</h3>
<p><b>12 декабря 1993 г.</b> на всенародном голосовании принята Конституция Российской Федерации. Её основы:</p>
<ul>
<li>Россия — демократическое федеративное правовое государство с республиканской формой правления (ст. 1).</li>
<li>Человек, его права и свободы — высшая ценность (ст. 2); идеологическое и политическое многообразие, разделение властей, признание частной собственности.</li>
<li><b>Президент</b> — глава государства и гарант Конституции, определяет основные направления внутренней и внешней политики, назначает с согласия Думы премьера, может распустить Думу; изначально избирался на 4 года (с 2012 г. — на 6 лет).</li>
<li><b>Федеральное собрание</b>: Совет Федерации (по два представителя от субъекта) и Государственная дума (450 депутатов).</li>
<li>Правительство, независимая судебная система во главе с Конституционным и Верховным судами; местное самоуправление.</li>
</ul>
<p>Многие юристы характеризуют модель как президентскую или «суперпрезидентскую» республику. Одновременно прошли выборы в первую Государственную думу, где по партийным спискам первой неожиданно стала ЛДПР В.В. Жириновского.</p>
<h3>Повседневная жизнь</h3>
<p>Для большинства 1990-е гг. стали временем выживания: обесцененные сбережения, задержки зарплат и пенсий, бартер, скрытая безработица, вторая работа, огороды. Возникли «челноки», рынки и ларьки, «новые русские», рэкет и криминал, финансовые пирамиды вроде «МММ». Падали рождаемость и продолжительность жизни, многие учёные уехали за границу («утечка мозгов»). Вместе с тем появились свобода слова и выезда, частное предпринимательство, изобилие товаров (для тех, кто мог их купить), религиозное возрождение, новые профессии и возможности.</p>
<h3>Россия в 1994–1999 гг. (кратко)</h3>
<p>Попытка силой восстановить контроль над Чечнёй привела к <b>первой чеченской войне</b> (1994–1996), закончившейся Хасавюртовскими соглашениями. В 1996 г. Ельцин переизбран, победив лидера КПРФ Г.А. Зюганова во втором туре. Финансовый кризис 17 августа 1998 г. (<b>дефолт</b>) обрушил рубль. 31 декабря 1999 г. Ельцин досрочно ушёл в отставку, исполняющим обязанности президента стал В.В. Путин.</p>

<h3>Наследство СССР</h3>
<p>В декабре 1991 г. Россия была признана <b>государством — продолжателем СССР</b>: она заняла место Союза постоянного члена Совета Безопасности ООН, приняла его посольства, договоры и внешние долги, а взамен — зарубежные активы («нулевой вариант»). По Лиссабонскому протоколу (1992) Украина, Белоруссия и Казахстан отказались от размещённого у них ядерного оружия в пользу России, получив гарантии безопасности по Будапештскому меморандуму (1994). В 1994 г. завершился <b>вывод российских войск из Германии и Прибалтики</b>.</p>
<h3>Прозападный курс (1991–1995)</h3>
<p>Министр иностранных дел <b>А.В. Козырев</b> исходил из того, что Россия — часть западного мира и союзник США. Подписан <b>Договор СНВ-2</b> (январь 1993) о глубоком сокращении стратегических вооружений, Россия вступила в МВФ и Всемирный банк (1992), присоединилась к программе НАТО «Партнёрство ради мира» (1994), подписала Соглашение о партнёрстве и сотрудничестве с ЕС (1994), вступила в <b>Совет Европы</b> (1996). Расчёт на масштабную западную помощь и равноправное партнёрство оправдался лишь частично; критики называли этот курс уступчивым.</p>
<h3>СНГ и «ближнее зарубежье»</h3>
<p>Приоритетом объявлялись отношения с бывшими республиками СССР. <b>Договор о коллективной безопасности</b> (Ташкент, 15 мая 1992 г.) стал основой будущей ОДКБ (2002). Россия участвовала в урегулировании конфликтов и миротворческих операциях в Приднестровье (1992), Южной Осетии (1992), Абхазии (1994), в гражданской войне в Таджикистане (1992–1997). Создавался Таможенный союз (1995), 8 декабря 1999 г. подписан Договор о создании <b>Союзного государства России и Белоруссии</b>. Сложными были отношения с Украиной (Крым, Черноморский флот), урегулированные Договором о дружбе (1997) и соглашениями о флоте.</p>
<h3>Балканы и расширение НАТО</h3>
<p>Распад Югославии сопровождался войнами в Хорватии и Боснии (1992–1995). Россия участвовала в миротворческих силах и переговорах, традиционно поддерживая сербов, но не смогла влиять на решения: в 1995 г. НАТО бомбило позиции боснийских сербов, мир был заключён в Дейтоне. Главной проблемой стало <b>расширение НАТО на восток</b>, против которого Россия возражала. Компромиссом стал <b>Основополагающий акт Россия — НАТО</b> (1997), но в 1999 г. в альянс вступили Польша, Чехия и Венгрия.</p>
<h3>Курс Е.М. Примакова (1996–1999)</h3>
<p>Сменивший Козырева в январе 1996 г. <b>Е.М. Примаков</b> провозгласил принципы <b>многовекторности</b> и <b>многополярного мира</b>, защиты национальных интересов при отказе от конфронтации. Укреплялись отношения с Китаем («стратегическое партнёрство», «Шанхайская пятёрка» 1996 г.), Индией, странами Ближнего Востока. Россия была принята в «Большую восьмёрку» (с 1997–1998 гг.).</p>
<p>В марте 1999 г. НАТО без санкции Совета Безопасности ООН начало бомбардировки Югославии из-за конфликта в Косово. <b>24 марта 1999 г.</b> Примаков, летевший в США, развернул самолёт над Атлантикой в знак протеста («разворот над Атлантикой»). В июне 1999 г. российские десантники совершили марш-бросок к аэропорту Приштины. Эти события стали рубежом: доверие к Западу резко упало.</p>
<h3>Мировые кризисы 1990-х</h3>
<ul>
<li><b>Геополитические</b>: распад биполярной системы и попытка США выстроить однополярный мир; войны в Персидском заливе (1991), Югославии и на Кавказе; рост международного терроризма.</li>
<li><b>Геоэкономические</b>: глобализация и зависимость России от внешних кредитов и цен на сырьё; <b>азиатский финансовый кризис 1997 г.</b> и падение цен на нефть привели к <b>российскому дефолту 17 августа 1998 г.</b>, после которого рубль обесценился в несколько раз.</li>
</ul>
<h3>Итоги</h3>
<p>Россия сохранила статус постоянного члена Совбеза и ядерной державы, урегулировала наследство СССР, вывела войска, наладила связи с Западом и Азией, стала членом «восьмёрки». Но экономическая слабость ограничивала её возможности: не удалось остановить расширение НАТО и военное вмешательство на Балканах, влияние в Восточной Европе было утрачено. К концу десятилетия сложился курс на многополярность, который продолжился в 2000-е гг.</p>

<h3>Внешняя политика: от партнёрства к противостоянию</h3>
<p>Концепция внешней политики 2000 г. провозгласила прагматизм и многополярный мир. После 11 сентября 2001 г. Россия поддержала антитеррористическую операцию США, в 2002 г. создан <b>Совет Россия — НАТО</b>, подписан договор о сокращении стратегических потенциалов. Но США вышли из Договора по ПРО (2002), Россия выступила против войны в Ираке (2003), НАТО расширилось за счёт Прибалтики (2004), прошли «цветные революции» в Грузии и Украине. В <b>Мюнхенской речи</b> (10 февраля 2007 г.) Путин подверг критике однополярный мир и расширение НАТО. В <b>августе 2008 г.</b> после нападения Грузии на Цхинвал Россия провела операцию «по принуждению к миру» и признала независимость Абхазии и Южной Осетии.</p>
<p>«Перезагрузка» с США дала <b>Договор СНВ-3</b> (Прага, 2010). Развивалась евразийская интеграция: ОДКБ (2002), ШОС (2001), Таможенный союз (2010), <b>Евразийский экономический союз</b> (с 1 января 2015 г.), партнёрство в <b>БРИКС</b>; углублялось сотрудничество с Китаем. С 30 сентября 2015 г. по просьбе правительства Сирии ВКС России участвовали в боях против ИГИЛ и других группировок.</p>
<h3>Украинский кризис</h3>
<p>После смены власти в Киеве в феврале 2014 г. в Крыму прошёл референдум, и <b>18 марта 2014 г.</b> подписан договор о принятии Крыма и Севастополя в состав России (в России событие называют воссоединением; Украина и большинство государств мира его не признали). На Донбассе начался вооружённый конфликт, Минские соглашения (2014–2015) не были выполнены. Отношения с Западом резко ухудшились, последовали санкции, Россию исключили из «восьмёрки». В декабре 2021 г. Россия потребовала юридических гарантий нерасширения НАТО. 21 февраля 2022 г. Россия признала ДНР и ЛНР, <b>24 февраля 2022 г.</b> начала <b>специальную военную операцию</b> на Украине, объявив её целями защиту Донбасса, демилитаризацию и «денацификацию» Украины; Украина, страны Запада и большинство членов ООН квалифицировали её как агрессию. Последовали беспрецедентные санкции, уход многих западных компаний, частичная мобилизация (сентябрь 2022), включение в состав России ДНР, ЛНР, Запорожской и Херсонской областей (30 сентября 2022 г.; международно не признано). Россия переориентировала экономические связи на страны Азии, Ближнего Востока, Африки и Латинской Америки.</p>

// Интервал не длиннее 2 дней, чтобы до экзамена каждая карточка успела вернуться.
const MIN = 60e3, HOUR = 36e5, DAY = 864e5, CUTOFF = 4 * HOUR, MAX_IVL = 2;
const LEARN = [1 * MIN, 10 * MIN], RELEARN = LEARN;

function studyDayStart(now) {
  const d = new Date(now - CUTOFF);
  d.setHours(0, 0, 0, 0);
  return d.getTime() + CUTOFF;
}
function studyDayKey(now) {
  const d = new Date(now - CUTOFF);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function toReview(st, ivl, now) {
  st.s = "r"; st.step = 0;
  st.ivl = Math.min(MAX_IVL, Math.max(1, Math.round(ivl)));
  st.due = studyDayStart(now) + st.ivl * DAY;
}
function schedule(prev, g, now) {
  const st = prev ? { ...prev } : { s: "n", step: 0, ivl: 0, e: 2.5, l: 0 };
  if (st.s === "n") st.s = "l";
  if (st.s === "l" || st.s === "rl") {
    const steps = st.s === "l" ? LEARN : RELEARN;
    if (g === 1) { st.step = 0; st.due = now + steps[0]; }
    else if (g === 2) {
      st.due = now + (st.step === 0 && steps.length > 1 ? Math.round((steps[0] + steps[1]) / 2) : steps[Math.min(st.step, steps.length - 1)]);
    } else if (g === 3) {
      st.step += 1;
      if (st.step >= steps.length) toReview(st, st.s === "l" ? 1 : st.ivl, now);
      else st.due = now + steps[st.step];
    } else toReview(st, st.s === "l" ? 4 : st.ivl + 1, now);
  } else {
    // Снова — заново через минуту; Трудно — ещё раз сегодня; Хорошо — завтра; Легко — через 2 дня
    st.ivl = 1;
    if (g === 1) { st.l += 1; st.s = "rl"; st.step = 0; st.due = now + RELEARN[0]; }
    else if (g === 2) { st.s = "rl"; st.step = 1; st.due = now + RELEARN[1]; }
    else toReview(st, g === 3 ? 1 : 2, now);
  }
  st.e = Math.round(st.e * 100) / 100;
  st.t = now;
  return st;
}
function intervalLabel(prev, g, now) {
  const n = schedule(prev, g, now);
  if (n.s === "r") return `${n.ivl} дн`;
  const m = Math.round((n.due - now) / MIN);
  return m < 1 ? "<1 мин" : `${m} мин`;
}

function inDeck(c) {
  const d = S.settings.deck;
  if (!S.settings.kinds.includes(c.kind)) return false;
  if (d === "all") return true;
  if (d.startsWith("era:")) return TOPIC[c.n].era === d.slice(4);
  if (d.startsWith("t:")) return c.n === +d.slice(2);

}
function newLimitLeft() {

function queue(now) {
  const learn = [], learnSoon = [], review = [], fresh = [];
  for (const c of CARDS) {
    if (!inDeck(c)) continue;
    const st = S.cards[c.id];
    if (!st || st.s === "n") fresh.push(c);
    else if (st.s === "r") { if (st.due <= now) review.push(c); }
    else if (st.due <= now) learn.push(c);
    else if (st.due <= now + 20 * MIN) learnSoon.push(c);
  }
  const byDue = (a, b) => S.cards[a.id].due - S.cards[b.id].due;
  learn.sort(byDue); learnSoon.sort(byDue); review.sort(byDue);
  return { learn, learnSoon, review, fresh: fresh.slice(0, newLimitLeft()), freshAll: fresh.length };
}

function pickNext(now) {
  const q = queue(now);
  if (q.learn.length) return q.learn[0];
  if (q.review.length && (!q.fresh.length || shown % 4 !== 3)) return q.review[0];
  if (q.fresh.length) return q.fresh[0];
  if (q.review.length) return q.review[0];
  if (q.learnSoon.length) return q.learnSoon[0];

}

}

function overallStats() {

    const st = S.cards[c.id];
    if (!st || st.s === "n") { fresh++; continue; }
    started++;
    if (st.s === "r") learned++;
    if (st.due <= now) due++;

  return { today: Math.min(fresh, newLimitLeft()), learned, started, due };
}

function nextDueText(now) {
  let soonest = Infinity;
  for (const c of CARDS) {
    if (!inDeck(c)) continue;
    const st = S.cards[c.id];
    if (st && st.s !== "n" && st.due > now) soonest = Math.min(soonest, st.due);
  }
  if (soonest === Infinity) return "";
  const diff = soonest - now;
  if (diff < HOUR) return `Следующая карточка через ${Math.max(1, Math.round(diff / MIN))} мин.`;
  if (diff < DAY) return `Следующая карточка через ${Math.round(diff / HOUR)} ч.`;
  return `Следующее повторение через ${Math.round(diff / DAY)} дн.`;
}

function grade(g) {
  if (!current || !revealed) return;
  const now = Date.now();
  rollDay();
  const prev = S.cards[current.id];
  if (!prev || prev.s === "n") S.newToday += 1;
  S.cards[current.id] = schedule(prev, g, now);
  shown += 1;
  save();
  current = pickNext(Date.now());
  revealed = false;
  renderStudy();
}

    ${planHTML()}
    <p><b>Как проходить тему.</b> Прочитайте «Суть» и «План ответа», затем теорию. Закройте страницу и расскажите тему вслух по плану за 2–3 минуты, потом откройте её карточки. На тему уходит 15–20 минут, на весь день — около 3–4 часов вместе с карточками и билетами.</p>
    <p><b>Случайный билет</b> выдаёт две темы, как на экзамене. Отвечайте вслух на время, 3–5 минут на вопрос, потом сверьтесь со спрятанным планом. В первые дни берите билеты из уже пройденных тем: если выпала непройденная, вытяните другой.</p>
    <p class="note">Отметка «сейчас» ставится по пройденным карточкам, а не по календарю: начали позже или ушли вперёд — план подстроится.</p>

    <h2>Типичные ошибки</h2>
    <ul>
      <li>Перечитывать теорию вместо того, чтобы вспоминать. Чтение создаёт ощущение знания, а вспоминание — само знание.</li>
      <li>Оставлять темы на последний вечер: четвёртый день нужен для повторения, а не для нового.</li>
      <li>Отвечать без дат, имён и документов — ответ получается «общими словами».</li>
      <li>Нажимать «Хорошо», когда ответ вспомнился лишь частично.</li>
    </ul>
    <p class="note">Теория написана по общепринятым фактам курса отечественной истории. Если преподаватель давал свои материалы или акценты, сверяйтесь с ними: при расхождении приоритет у материалов курса.</p>
    <div class="row" style="margin-top:24px"><a class="btn primary" href="#cards">Перейти к карточкам</a><a class="btn" href="#t-1">Открыть тему 01</a></div>
  </article>`;
}

function setTabs() {
  const tab = view === "topic" ? "topics" : view;
  document.querySelectorAll("[data-tab]").forEach(a => {
    if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
function render() {
  setTabs();
  const withRail = view === "topics" || view === "topic";
  shell.classList.toggle("solo", !withRail);
  if (withRail) rail.innerHTML = listHTML(view === "topic" ? topicN : 0);
  if (view === "topic" && TOPIC[topicN]) renderTopic(TOPIC[topicN]);
  else if (view === "cards") renderStudy();
  else if (view === "guide") main.innerHTML = guideHTML();
  else renderOverview();
}
function route() {
  const h = location.hash.slice(1);
  const prevView = view, prevN = topicN;
  if (h === "cards") view = "cards";
  else if (h === "guide") view = "guide";
  else if (/^t-\d+$/.test(h) && TOPIC[+h.slice(2)]) { view = "topic"; topicN = +h.slice(2); }
  else view = "topics";
  confirmReset = false;
  render();
  if (prevView !== view || prevN !== topicN) {
    window.scrollTo(0, 0);
    if (view === "topic") {
      const a = rail.querySelector('[aria-current="page"]');
      if (a) a.scrollIntoView({ block: "nearest" });
    }
  }
}

// ---------- Случайный билет ----------
const ticket = $("#ticket");
let lastFocus = null;
function drawTicket() {
  const a = Math.floor(Math.random() * TOPICS.length);
  let b = Math.floor(Math.random() * (TOPICS.length - 1));
  if (b >= a) b += 1;
  const pair = [TOPICS[a], TOPICS[b]].sort((x, y) => x.n - y.n);
  $("#ticketList").innerHTML = pair.map((T, i) => `
    <li>
      <span class="mono">Вопрос ${i + 1} · тема ${pad(T.n)}</span>
      <p>${T.title}</p>
      <details><summary>Сверить с планом ответа</summary><ol>${T.plan.map(x => `<li>${x}</li>`).join("")}</ol>
        <p class="note"><a href="#t-${T.n}" data-close>Открыть теорию темы ${pad(T.n)}</a></p></details>
    </li>`).join("");
}
function openTicket() {
  lastFocus = document.activeElement;
  drawTicket();
  ticket.hidden = false;
  $("#ticketAgain").focus();
}
function closeTicket() {
  ticket.hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

// ---------- События ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.matches("[data-ticket]")) { openTicket(); return; }
  if (t.id === "ticketClose") { closeTicket(); return; }
  if (t.id === "ticketAgain") { drawTicket(); return; }
  if (t.matches("[data-close]")) { ticket.hidden = true; return; }
  if (t.matches("[data-study]")) {
    S.settings.deck = `t:${t.dataset.study}`; S.settingsAt = Date.now(); save();
    current = null; location.hash = "cards"; return;
  }
  if (t.id === "reveal") { revealed = true; renderStudy(); return; }
  if (t.matches(".grade")) { grade(+t.dataset.g); return; }
  if (t.matches("[data-kind]")) {
    const k = t.dataset.kind, kinds = S.settings.kinds;
    const nextKinds = kinds.includes(k) ? kinds.filter(x => x !== k) : KIND_ORDER.filter(x => kinds.includes(x) || x === k);
    if (!nextKinds.length) return;
    S.settings.kinds = nextKinds; S.settingsAt = Date.now(); save();
    current = null; renderStudy(); return;
  }
  if (t.id === "moreNew") { S.extraToday += 10; save(); current = null; renderStudy(); return; }
  if (t.id === "reset") { confirmReset = true; renderStudy(); return; }
  if (t.id === "resetNo") { confirmReset = false; renderStudy(); return; }
  if (t.id === "resetYes") {
    const keep = S.settings;
    S = blank(); S.settings = keep; S.settingsAt = Date.now(); rollDay();
    confirmReset = false; current = null; save(); renderStudy(); return;
  }
});
ticket.addEventListener("click", e => { if (e.target === ticket) closeTicket(); });
document.addEventListener("change", e => {
  if (e.target.id === "deck") {
    S.settings.deck = e.target.value; S.settingsAt = Date.now(); save();
    current = null; renderStudy();
  }
  if (e.target.id === "npd") {
    const v = Math.max(0, Math.min(300, Math.round(+e.target.value || 0)));
    S.settings.newPerDay = v; S.settingsAt = Date.now(); save();
    current = null; renderStudy();
  }
});
document.addEventListener("keydown", e => {
  if (!ticket.hidden && e.key === "Escape") { closeTicket(); return; }
  if (view !== "cards" || !ticket.hidden) return;
  if (e.target.closest("input, select, textarea, summary, button, a") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    if (!current) return;
    if (!revealed) { revealed = true; renderStudy(); } else grade(3);
  } else if (revealed && ["1", "2", "3", "4"].includes(e.key)) grade(+e.key);
});
window.addEventListener("hashchange", route);

route();
initSync();
</script>
</body>
</html>
